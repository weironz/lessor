# cargo-deny 的策略。CI 每次推送都跑（.github/workflows/ci.yml）。
#
# 为什么要有这个：lessor 是要装到客户机器上跑的东西，依赖树里混进一个
# 已知漏洞、或者一个协议不兼容的库，事后才发现的代价比现在拦住高得多。
# 而这类问题不会自己冒出来 —— 依赖是传递的，`cargo add` 一次可能带进
# 十几个包，没人会逐个去看。
#
# 每条规则都写了理由。以后要放宽某一条，先看看理由还成不成立。

[graph]
# 只检查我们真正会发出去的目标。检查所有平台会把一堆用不到的
# 平台专属依赖也拉进来，噪音大于价值。
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]

# ---------- 已知漏洞 ----------

[advisories]
# 有漏洞就红。这是这份配置存在的首要理由。
yanked = "deny"
ignore = [
    # 暂无。要加的话必须写清楚：漏洞编号、为什么我们不受影响、
    # 以及什么时候复查。没有理由的 ignore 等于把检查关掉。
]

# ---------- 许可证 ----------

[licenses]
# lessor 自己是 MIT。依赖的许可证必须和"可以随二进制分发给客户"相容 ——
# 混进一个 GPL 的传递依赖，法务上就是个大麻烦，而且往往是别人的依赖
# 悄悄带进来的，不主动查根本不知道。
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    "Unlicense",
]
# 这份名单只列**依赖树里真正出现过的**许可证。多列几个"反正也宽松"的
# 等于预先批准了没审过的东西 —— 真混进来一个新许可证时，让 CI 红一次、
# 逼人看一眼，比它悄悄溜进去强。
# 现在缺席但常见的：ISC、MPL-2.0、CC0-1.0。要加就在这儿加，顺手写上是
# 哪个依赖带进来的。
# 低于这个置信度就当没识别出来，宁可人工看一眼
confidence-threshold = 0.9

# ---------- 依赖树本身 ----------

[bans]
# 同一个库出现多个版本：不致命，但值得知道 —— 它会让二进制变大，
# 偶尔还会导致"两个版本的同一个类型互不兼容"这种难查的编译错误。
multiple-versions = "warn"
# 通配符版本号（"*"）意味着任何一次 cargo update 都可能换掉实现
wildcards = "deny"
# 但工作区内部的 path 依赖天然没有版本号，那不是通配符风险 ——
# 它们和被依赖方在同一次提交里一起改
allow-wildcard-paths = true

# ---------- 来源 ----------

[sources]
# 只从 crates.io 拿。git 依赖没有版本语义、也不在 advisory 数据库的
# 覆盖范围里，要用必须是明确的决定，不能悄悄混进来。
unknown-registry = "deny"
unknown-git = "deny"
