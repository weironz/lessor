# 每次推送都跑的检查。发布流水线在 release.yml。
#
# 构建顺序是硬性的：ui/dist 是 lessord 的编译期依赖（rust-embed 编译期
# 就要读它），所以必须先 bun build 再碰任何 cargo 命令 —— 包括 clippy。
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # 两个平台都跑。收发那层有相当一部分代码在 #[cfg(windows)] /
  # #[cfg(target_os = "linux")] 里，只跑一个平台等于另一半永远没被
  # CI 看过 —— 实际发生过：一处 needless_return 只在 Linux 上成立，
  # 在 Windows 开发机上编译不到，红了两次才被发现。
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # 读 package.json 里的 packageManager 字段，和本机钉的同一个版本
          bun-version-file: ui/package.json

      - name: 构建前端
        working-directory: ui
        run: |
          bun install --frozen-lockfile
          bun run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: 格式
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 测试
        run: cargo test --workspace

  # 依赖树的策略检查：已知漏洞、许可证、来源。策略在 deny.toml，每条都写了理由。
  #
  # 单开一个 job 而不是塞进 check：它和平台无关（读的是 Cargo.lock，不编译），
  # 跑两遍是浪费；而且它红的时候原因和"代码有问题"完全不同，分开看更清楚。
  #
  # 不需要 bun —— cargo metadata 不碰 ui/dist。
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
