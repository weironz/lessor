# 发布流水线，由 v* 标签触发。
#
# 产物：
#   - lessord 镜像（前后端一体，界面在二进制里；另带 lessor-netcfg）
#     → Docker Hub（willdockerhub/lessord）
#     → 阿里云 ACR（registry.cn-shenzhen.aliyuncs.com/willspace/lessord）
#   - GitHub Release：桌面端 Windows 安装程序（NSIS）+ 两个平台的命令行压缩包
#
# 不推 ghcr。secret：DOCKERHUB_USERNAME / DOCKERHUB_TOKEN / ACR_USERNAME / ACR_PASSWORD。
name: release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  ACR_REGISTRY: registry.cn-shenzhen.aliyuncs.com
  ACR_NAMESPACE: willspace

permissions:
  contents: write

jobs:
  # 标签必须和工作区版本一致，对不上就当场失败 ——
  # 好过发出去一个 v0.0.2 标签、里面装着 0.0.1 的二进制。
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验标签与版本一致
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_ver=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          tauri_ver=$(grep -m1 '"version"' ui/src-tauri/tauri.conf.json | sed 's/.*: "\(.*\)".*/\1/')
          echo "tag=$tag cargo=$cargo_ver tauri=$tauri_ver"
          [ "$tag" = "$cargo_ver" ] && [ "$tag" = "$tauri_ver" ] || {
            echo "::error::标签 v$tag 和仓库里的版本号对不上"; exit 1; }

      # 公钥还是占位符的话，更新包能打出来、也能签，但装到用户机器上会因为
      # 公钥对不上被拒 —— 发布看着成功，自动更新其实是坏的。在这里拦住。
      - name: 校验更新公钥已配置
        run: |
          grep -q 'PUBKEY_PLACEHOLDER' ui/src-tauri/tauri.conf.json && {
            echo "::error::tauri.conf.json 里的 updater.pubkey 还是占位符 —— 见 docs/desktop-update.md"
            exit 1; } || true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ui/package.json

      - name: 构建前端
        working-directory: ui
        run: |
          bun install --frozen-lockfile
          bun run build

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: 测试
        run: cargo test --workspace

  # Linux 二进制 + 镜像。二进制在 runner 上编好放进构建上下文，
  # 镜像里只做打包（见 docker/Dockerfile.dist 头部说明）。
  docker:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ui/package.json

      - name: 构建前端
        working-directory: ui
        run: |
          bun install --frozen-lockfile
          bun run build

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: 构建 Linux 二进制
        run: |
          cargo build --release -p lessord -p lessor-net
          cp target/release/lessord target/release/lessor-netcfg docker/

      - name: 打 Linux 命令行压缩包
        run: |
          v="${GITHUB_REF_NAME#v}"
          mkdir -p out
          tar -czf "out/lessor-$v-x86_64-linux.tar.gz" \
            -C target/release lessord lessor-netcfg
      - uses: actions/upload-artifact@v4
        with:
          name: cli-linux
          path: out/*.tar.gz

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 推镜像
        run: |
          v="${GITHUB_REF_NAME#v}"
          img_hub="${{ secrets.DOCKERHUB_USERNAME }}/lessord"
          img_acr="$ACR_REGISTRY/$ACR_NAMESPACE/lessord"
          docker build -f docker/Dockerfile.dist \
            -t "$img_hub:$v" -t "$img_hub:latest" \
            -t "$img_acr:$v" -t "$img_acr:latest" \
            docker/
          docker push "$img_hub:$v";  docker push "$img_hub:latest"
          docker push "$img_acr:$v";  docker push "$img_acr:latest"

  # 桌面端 NSIS 安装程序 + Windows 命令行压缩包，同一台 runner 出两样。
  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ui/package.json

      - name: 构建前端
        working-directory: ui
        run: |
          bun install --frozen-lockfile
          bun run build

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            ui/src-tauri

      # 桌面端随包自带 lessord（sidecar），装完即可用，不必先手工起服务。
      # 文件名必须带 target triple —— Tauri 按这个规则找。
      # 注意顺序：tauri.conf.json 里声明了 externalBin，文件不在的话
      # 构建脚本直接失败，所以这一步必须排在 tauri build 之前。
      - name: 准备 sidecar
        shell: bash
        run: |
          cargo build --release -p lessord
          mkdir -p ui/src-tauri/binaries
          cp target/release/lessord.exe ui/src-tauri/binaries/lessord-x86_64-pc-windows-msvc.exe

      # 更新包必须签名。这不是 Windows 代码签名证书（那个我们不买，见
      # ROADMAP 的"已否决"），是 Tauri 自己的 minisign 签名 —— 免费，但
      # **没有它自动更新就是个后门**：谁能替换掉发布物，谁就能在客户机器上
      # 执行代码。私钥只存在 GitHub Secrets 里。
      #
      # 密钥没配时这一步会失败，而不是悄悄产出一个装不上的更新包。
      - name: 桌面端安装程序
        working-directory: ui
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || {
            echo "::error::缺少 TAURI_SIGNING_PRIVATE_KEY —— 没有它自动更新装不上，见 docs/desktop-update.md"
            exit 1
          }
          bunx tauri build --bundles nsis
        shell: bash

      # 更新用的签名文件跟着安装程序一起发。桌面端下载安装程序之后，
      # 用配置里的公钥验这份签名，对不上就拒装。
      - name: 收集更新包与签名
        shell: bash
        run: |
          mkdir -p updater
          cp ui/src-tauri/target/release/bundle/nsis/*-setup.exe updater/
          cp ui/src-tauri/target/release/bundle/nsis/*-setup.exe.sig updater/
          ls -la updater/

      - name: Windows 命令行压缩包
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          cargo build --release -p lessor-net
          mkdir -p out
          7z a "out/lessor-$v-x86_64-windows.zip" \
            ./target/release/lessord.exe ./target/release/lessor-netcfg.exe

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            ui/src-tauri/target/release/bundle/nsis/*.exe
            ui/src-tauri/target/release/bundle/nsis/*.exe.sig

      - uses: actions/upload-artifact@v4
        with:
          name: cli-windows
          path: out/*.zip

  release:
    needs: [docker, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 校验产物齐全
        run: |
          ls -la dist/
          test -n "$(ls dist/*-setup.exe)" || { echo "::error::缺桌面端安装程序"; exit 1; }
          test -n "$(ls dist/*.tar.gz)"    || { echo "::error::缺 Linux 压缩包"; exit 1; }
          test -n "$(ls dist/*.zip)"       || { echo "::error::缺 Windows 压缩包"; exit 1; }
          test -n "$(ls dist/*-setup.exe.sig)" || { echo "::error::缺更新包签名，装不上"; exit 1; }

      # 桌面端的自动更新靠这份清单发现新版本。地址固定指向
      # releases/latest/download/latest.json —— 每次发版覆盖它，
      # 老版本据此知道有新的。
      #
      # signature 是安装程序的 minisign 签名，桌面端用内置公钥校验；
      # 对不上就拒装。这是"下载完就执行"这件事唯一的安全依据。
      - name: 生成更新清单 latest.json
        run: |
          v="${GITHUB_REF_NAME#v}"
          setup=$(ls dist/*-setup.exe | head -1)
          sig=$(cat "${setup}.sig")
          notes=$(printf '%s' "lessor $GITHUB_REF_NAME，变更见 CHANGELOG.md")
          cat > dist/latest.json <<JSON
          {
            "version": "$v",
            "notes": "$notes",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "signature": "$sig",
                "url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$(basename "$setup")"
              }
            }
          }
          JSON
          # 自己先解析一遍，格式坏了在这里失败，别等用户点更新时才发现
          python3 -c "import json,sys; d=json.load(open('dist/latest.json'));             assert d['platforms']['windows-x86_64']['signature'], '签名为空';             print('latest.json ok, version=', d['version'])"

      # 客户的安全扫描要一份物料清单。对源码目录生成 —— 只扫二进制的话
      # 前端那半就漏了。
      - uses: actions/checkout@v4
        with:
          path: src

      # syft 不认 bun.lock（实测：只扒到 Cargo.lock 里的 642 个 crate，
      # npm 包一个都没有）。bun 能顺手导出一份 yarn.lock，syft 认这个 ——
      # 加上之后 102 个前端包才进得来。
      # 一份自称完整、实际只有一半的 SBOM 比没有更糟：客户拿它扫，
      # 扫不出前端的漏洞还以为是干净的。
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ui/package.json
      - name: 给 SBOM 备一份 syft 认得的前端清单
        working-directory: src/ui
        run: bun install --frozen-lockfile --yarn

      - name: 生成 SBOM
        uses: anchore/sbom-action@v0
        with:
          path: src
          format: spdx-json
          artifact-name: lessor-${{ github.ref_name }}.spdx.json
          output-file: dist/lessor-${{ github.ref_name }}.spdx.json

      - name: 校验 SBOM 两侧依赖都在
        run: |
          f="dist/lessor-${{ github.ref_name }}.spdx.json"
          test -s "$f" || { echo "::error::SBOM 没生成"; exit 1; }
          grep -q '"name": *"tokio"' "$f" || { echo "::error::SBOM 里没有 Rust 依赖"; exit 1; }
          grep -q '"name": *"svelte"' "$f" || { echo "::error::SBOM 里没有前端依赖"; exit 1; }
          echo "SBOM 包数：$(grep -c '"SPDXID": *"SPDXRef-Package' "$f")"

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            前后端一体的跨平台 DHCP 服务器。界面已打进 `lessord` 二进制，一个文件即可运行。

            ## 镜像

            ```
            docker pull willdockerhub/lessord:${{ github.ref_name }}
            docker pull registry.cn-shenzhen.aliyuncs.com/willspace/lessord:${{ github.ref_name }}
            ```

            容器里发 DHCP 要 `--network host`（广播过不了 NAT）；管理接口记得
            `--http 0.0.0.0:8080` 才能从容器外访问。

            ## 本次版本验证到哪一步

            129 个测试；五种真实客户端：busybox udhcpc、systemd-networkd、
            VMware UEFI 固件（PXE 与 HTTP Boot 两种模式）、iPXE 2.0.0+ ——
            PXE 一路验到 GRUB 提示符。细节见仓库 docs/。

            ## 已知边界

            早期版本：租约仅内存存储（重启即失）、只支持 IPv4、macOS 上无法做收包隔离。
