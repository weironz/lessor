[workspace]
resolver = "3"
members = [
    "crates/lessor-core",
    "crates/lessor-net",
    "crates/discovery",
    "crates/lessord",
]

[workspace.package]
version = "0.0.5"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
lessor-core = { path = "crates/lessor-core" }
lessor-net  = { path = "crates/lessor-net" }
discovery   = { path = "crates/discovery" }

dhcproto  = "0.15"
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing   = "0.1"
tokio     = { version = "1", features = ["full"] }
axum      = { version = "0.8", features = ["ws"] }
socket2   = { version = "0.5", features = ["all"] }
clap      = { version = "4", features = ["derive", "env"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow    = "1"
ipnet     = { version = "2", features = ["serde"] }
network-interface = "2"
rust-embed = { version = "8", features = ["mime-guess"] }
# bundled：自带 SQLite 源码一起编，不依赖目标机器上的系统库 ——
# "一个文件拷过去就跑"的形态容不下运行时依赖
rusqlite  = { version = "0.40", features = ["bundled"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
