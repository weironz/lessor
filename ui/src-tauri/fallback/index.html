<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>lessor</title>
    <style>
      :root {
        --bg: #f4f6f7;
        --panel: #ffffff;
        --ink: #151c21;
        --muted: #6b7a85;
        --line: #dce3e7;
        --accent: #0e6e70;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e1418;
          --panel: #151d22;
          --ink: #dbe4e8;
          --muted: #7f8f99;
          --line: #253139;
          --accent: #55b2b4;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
        font-size: 14px;
        line-height: 1.7;
      }
      .card {
        width: min(560px, 90vw);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 28px 30px;
      }
      h1 { margin: 0 0 4px; font-size: 19px; }
      .sub { margin: 0 0 20px; color: var(--muted); }
      p { margin: 0 0 14px; }
      code, input {
        font-family: "JetBrains Mono", Consolas, ui-monospace, monospace;
        font-size: 13px;
      }
      pre {
        margin: 0 0 16px;
        padding: 11px 13px;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 4px;
        overflow-x: auto;
        font-size: 12.5px;
      }
      .row { display: flex; gap: 8px; margin-bottom: 14px; }
      input {
        flex: 1;
        padding: 7px 10px;
        color: var(--ink);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 4px;
      }
      button {
        font: inherit;
        font-size: 13px;
        padding: 7px 16px;
        color: #fff;
        background: var(--accent);
        border: 1px solid var(--accent);
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover { filter: brightness(1.1); }
      .status { color: var(--muted); font-size: 13px; }
      .err { color: #b3452f; font-size: 13px; margin: 0 0 10px; }
      select {
        flex: 1;
        padding: 7px 10px;
        font: inherit;
        font-size: 13px;
        color: var(--ink);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 4px;
      }
      .split {
        margin: 20px 0 16px;
        border: 0;
        border-top: 1px solid var(--line);
      }
      .sect-title { font-weight: 600; margin: 0 0 10px; }
      #local { display: none; }
      .hint { color: var(--muted); font-size: 12.5px; margin: 8px 0 0; }
      .dot {
        display: inline-block;
        width: 7px; height: 7px;
        margin-right: 6px;
        border-radius: 50%;
        background: var(--muted);
        animation: pulse 1.4s ease-in-out infinite;
      }
      @keyframes pulse { 50% { opacity: 0.25; } }
      @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>连不上 lessord</h1>
      <p class="sub">桌面端只是界面，DHCP 服务由 lessord 提供，需要先把它跑起来。</p>

      <pre id="cmdline">lessord --listen &lt;本机在该网段上的地址&gt; \
        --prefix 24 \
        --pool 192.168.88.10-192.168.88.20</pre>

      <div id="local">
        <p class="sect-title">在这台电脑上启动</p>
        <div class="row">
          <select id="iface"></select>
        </div>
        <div class="row">
          <input id="pool" spellcheck="false" placeholder="地址池，如 192.168.88.100-192.168.88.199" />
          <button id="start">启动</button>
        </div>
        <p class="err" id="localErr" hidden></p>
        <p class="hint">拉起的实例随窗口关闭而退出；要常驻请单独运行 lessord。
        首次启动 Windows 可能弹防火墙提示，需要允许。</p>
        <hr class="split" />
        <p class="sect-title">或者，连接已在运行的服务</p>
      </div>

      <p>服务默认监听 <code>127.0.0.1:8080</code>。跑在别处的话改这里：</p>

      <div class="row">
        <input id="url" spellcheck="false" />
        <button id="go">连接</button>
      </div>

      <p class="status"><span class="dot"></span><span id="msg">正在等待服务…</span></p>
    </div>

    <script>
      const input = document.getElementById('url')
      const msg = document.getElementById('msg')
      input.value = window.__LESSOR_URL__ || 'http://127.0.0.1:8080'

      let tries = 0

      async function probe() {
        const url = input.value.replace(/\/+$/, '')
        try {
          // 管理接口刻意不发 CORS 头（否则任何网页都能读它），所以这里用
          // no-cors：拿不到响应内容，但 promise 解决就说明端口有人听。
          // 之后的整页跳转不受 CORS 约束。
          await fetch(url + '/healthz', { cache: 'no-store', mode: 'no-cors' })
          msg.textContent = '已连上，正在打开界面…'
          location.href = url + '/'
          return true
        } catch {
          // 还没起来，继续等
        }
        tries += 1
        msg.textContent = `正在等待服务…（第 ${tries} 次尝试）`
        return false
      }

      document.getElementById('go').addEventListener('click', probe)
      input.addEventListener('keydown', (e) => e.key === 'Enter' && probe())

      // 服务起来后自动进去，不用手动点
      setInterval(probe, 2000)
      probe()

      // ---- 桌面壳专属：一键拉起本机实例 ----
      // 普通浏览器里没有 __TAURI__，这一段整个不出现。
      const tauri = window.__TAURI__ && window.__TAURI__.core
      if (tauri) {
        // 少一个 id 就会让下面整段静默失效（对 null 取属性抛异常，
        // 而这段是同步执行的，异常之后什么都不会发生）。宁可当场吵一句。
        const el = (id) => {
          const n = document.getElementById(id)
          if (!n) throw new Error('回退页缺少 #' + id)
          return n
        }
        const local = el('local')
        const sel = el('iface')
        const pool = el('pool')
        const err = el('localErr')
        const startBtn = el('start')
        el('cmdline').style.display = 'none'
        let ifaces = []

        // 按所选网卡给一个能用的默认池：/24 及更小的网段取 .100-.199，
        // 更大的网段猜不准，留给用户填
        function suggest() {
          const it = ifaces[sel.selectedIndex]
          if (!it) return
          if (it.prefix >= 24) {
            const base = it.addr.split('.').slice(0, 3).join('.')
            pool.value = `${base}.100-${base}.199`
          } else {
            pool.value = ''
          }
        }

        tauri.invoke('list_interfaces').then((list) => {
          ifaces = list
          if (!list.length) return
          for (const it of list) {
            const o = document.createElement('option')
            o.textContent = `${it.name} — ${it.addr}/${it.prefix}`
            sel.appendChild(o)
          }
          suggest()
          local.style.display = 'block'
        }).catch(() => { /* 枚举失败就保持纯客户端形态 */ })

        sel.addEventListener('change', suggest)

        startBtn.addEventListener('click', async () => {
          const it = ifaces[sel.selectedIndex]
          if (!it) return
          err.hidden = true
          startBtn.disabled = true
          startBtn.textContent = '启动中…'
          try {
            const url = await tauri.invoke('start_local', {
              listen: it.addr,
              prefix: it.prefix,
              pool: pool.value.trim(),
            })
            location.href = url + '/'
          } catch (e) {
            err.textContent = String(e)
            err.hidden = false
            startBtn.disabled = false
            startBtn.textContent = '启动'
          }
        })
      }
    </script>
  </body>
</html>
