[package]
name = "lessor-desktop"
version = "0.0.4"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "lessor 的桌面外壳"
default-run = "lessor-desktop"

# 独立于主 workspace：Tauri 的构建脚本和依赖树与服务端无关，
# 混进去只会拖慢 cargo test 之类的日常命令。
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# 自动更新。签名校验是它自带的 —— 更新包必须由我们的私钥签过才会被装，
# 否则谁能替换掉发布物谁就能在客户机器上执行代码。
tauri-plugin-updater = "2"
# 装完重启自己
tauri-plugin-process = "2"
# generate_context! 要把 capabilities 里的 JSON 内嵌进来，需要它在作用域里
serde_json = "1"


# 只为把子进程绑进 Job Object：外壳被强杀（任务管理器 / 崩溃）时，
# 由内核保证带走 lessord，而不是留一个没人管的 DHCP 服务器在发地址。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
