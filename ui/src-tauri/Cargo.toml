[package]
name = "lessor-desktop"
version = "0.0.2"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "lessor 的桌面外壳"
default-run = "lessor-desktop"

# 独立于主 workspace：Tauri 的构建脚本和依赖树与服务端无关，
# 混进去只会拖慢 cargo test 之类的日常命令。
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }


# 只为把子进程绑进 Job Object：外壳被强杀（任务管理器 / 崩溃）时，
# 由内核保证带走 lessord，而不是留一个没人管的 DHCP 服务器在发地址。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
