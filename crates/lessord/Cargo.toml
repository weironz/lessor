[package]
name = "lessord"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# 不往 crates.io 发。这些 crate 是一个应用的组成部分，互相之间用 path
# 依赖（没有版本号）—— 发布出去别人是解析不了的。标死了也顺带防住误
# `cargo publish`。将来真要把 lessor-core 单独发出去，先给它换成带版本号
# 的依赖声明。
publish = false
description = "lessor 的服务进程：DHCP 引擎 + HTTP/WebSocket API"

[dependencies]
lessor-core.workspace = true
lessor-net.workspace = true
rusqlite.workspace = true
discovery.workspace = true
rust-embed.workspace = true
dhcproto.workspace = true
tokio.workspace = true
axum.workspace = true
socket2.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
ipnet.workspace = true

[dev-dependencies]
# start_paused —— 让 --idle-exit 的计时逻辑可以确定性地测，
# 不用真的在测试里等上几十秒
tokio = { workspace = true, features = ["test-util"] }
